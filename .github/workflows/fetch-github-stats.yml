name: Fetch GitHub Stats (Nightly)

on:
  schedule:
    # 03:00 JST = 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of tools to process'
        default: '100'
        required: false

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Call fetch-github-stats Edge Function
        run: |
          LIMIT="${{ github.event.inputs.limit || '100' }}"
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/fetch-github-stats" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"limit\": ${LIMIT}}")

          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Edge Function returned error status: $HTTP_STATUS"
            exit 1
          fi
