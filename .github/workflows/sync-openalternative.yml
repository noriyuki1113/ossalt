name: Sync OpenAlternative (Weekly)

on:
  schedule:
    # Monday 04:00 JST = Sunday 19:00 UTC
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      max:
        description: 'Max candidates to queue per run (1-100)'
        default: '50'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-openalternative Edge Function
        run: |
          MAX="${{ github.event.inputs.max || '50' }}"
          case "$MAX" in
            ''|*[!0-9]*) echo 'max must be an integer'; exit 1 ;;
          esac
          if [ "$MAX" -lt 1 ] || [ "$MAX" -gt 100 ]; then
            echo 'max must be between 1 and 100'; exit 1
          fi
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/sync-openalternative?max=${MAX}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "x-sync-token: ${{ secrets.SYNC_OPENALTERNATIVE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{}")

          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Edge Function returned error status: $HTTP_STATUS"
            exit 1
          fi
